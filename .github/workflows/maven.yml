name: maven.yml
on:
  workflow_call:
    inputs:
      pom-file:
        description: "Path to pom.xml file"
        required: false
        type: string
        default: "pom.xml"
      maven-phase:
        description: "Maven phase to execute"
        required: false
        type: string
        default: "install"
      maven-args:
        description: "Additional Maven arguments"
        required: false
        type: string
      build-artifact-name:
        description: "Name of the build artifact to download"
        required: false
        type: string
      build-artifact-path:
        description: "Path of the build artifact to download"
        required: false
        type: string

permissions:
  contents: read

jobs:
  maven:
    name: Maven Build & Test
    permissions:
      contents: write
      actions: read
      packages: write # write impliziert read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          # Need to access the packages in private repo
          # Remove when repo get public
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Maven Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/src/**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Spotless Check
        run: ./mvnw -f ${{ inputs.pom-file }} -B spotless:check

      - name: Build & test maven project
        run: ./mvnw -f ${{ inputs.pom-file }} -B ${{ inputs.maven-args }} ${{ inputs.maven-phase }}

      - name: Update dependency graph
        if: github.ref_name == 'main'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          maven-args: -f ${{ inputs.pom-file }}

      - name: Upload maven build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.build-artifact-name && inputs.build-artifact-path }}
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.build-artifact-path }}
          retention-days: 4
